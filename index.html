<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameHub Demo</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><b>‹</b><strong>Game<span>Hub</span></strong><b>♬</b></header><nav><button class="active" data-g="wingo">🎯 WinGo</button><button data-g="aviator">✈️ Aviator</button><button data-g="cricket">🏏 Cricket</button></nav><main>
<section id="wingo" class="game active"><div class="notice"><b>WinGo Demo</b><br><small>Virtual points only — no real-money betting</small></div><div class="round"><b>WinGo 30sec<br><i id="recent"></i></b><strong id="timer">00:30</strong></div><div class="filters"><button>Green</button><button>Violet</button><button>Red</button></div><div id="nums" class="nums"></div><div class="panel"><h3>Game History</h3><div id="hist"></div></div></section>
<section id="aviator" class="game"><div class="notice"><b>✈️ Aviator Demo</b><br><small>Virtual points only</small></div><div class="aviator"><div id="plane">✈️</div><b id="mult">1.00x</b><span id="status">Ready</span></div><div class="controls"><button id="start">Start Demo Flight</button><button id="reset">Reset</button></div><div class="panel"><h3>Flight History</h3><div id="fh"></div></div></section>
<section id="cricket" class="game"><div class="notice"><b>🏏 Cricket Demo</b><br><small>Free-play score simulation</small></div><div class="score"><b id="score">0/0</b><small>Overs <span id="overs">0.0</span></small></div><div class="pitch">🏏 &nbsp; • &nbsp; 🏏</div><div class="controls"><button id="hit">Hit Ball</button><button id="new">New Innings</button></div><div class="scoreBtns"><button data-r="1">+1</button><button data-r="2">+2</button><button data-r="4">+4</button><button data-r="6">+6</button><button data-r="0">Dot</button><button data-r="W">Wicket</button></div><div class="panel"><h3>Commentary</h3><div id="comment">Match ready.</div></div></section></main><footer>Demo games • Virtual points only</footer></div><script src="script.js"></script></body></html>
